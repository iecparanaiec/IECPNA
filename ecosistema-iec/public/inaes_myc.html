<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="description" content="Programa de capacitación dirigido a los equipos administrativos de cooperativas y mutuales, presentado ante INAES Entre Ríos para su articulación y difusión institucional.">
  <title>Programa de Inteligencia Operativa para Cooperativas y Mutuales | Propuesta presentada ante INAES</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--bg:#060a12;--panel:#0d1526}
    *{box-sizing:border-box;font-family:'DM Sans',sans-serif}html,body{margin:0;background:var(--bg)}body{color:#fff;overflow:hidden}button{font:inherit}
    .slide{display:none;width:100%;height:100vh;min-height:100vh;overflow-y:auto;overflow-x:hidden;padding:5.4rem 1.5rem 5.3rem;position:relative}.slide.active{display:flex}
    .bg-pattern{background-image:radial-gradient(circle at 15% 15%,rgba(34,211,238,.12),transparent 25%),radial-gradient(circle at 85% 78%,rgba(139,92,246,.13),transparent 30%),linear-gradient(90deg,rgba(59,130,246,.05) 1px,transparent 1px),linear-gradient(rgba(59,130,246,.05) 1px,transparent 1px);background-size:auto,auto,52px 52px,52px 52px}
    .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 70px rgba(0,0,0,.24)}
    .pill{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
    .gradient-text{background:linear-gradient(135deg,#67e8f9,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .green-text{background:linear-gradient(135deg,#86efac,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .amber-text{background:linear-gradient(135deg,#fde68a,#f59e0b,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo{width:95px;height:95px;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}.iec-logo{height:90px;max-width:230px;object-fit:contain}
    .nav{position:fixed;top:50%;z-index:80;transform:translateY(-50%);width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.92);border:1px solid rgba(103,232,249,.55);box-shadow:0 12px 32px rgba(0,0,0,.38),0 0 0 1px rgba(34,211,238,.08) inset;backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s ease}.nav:hover{background:rgba(8,145,178,.32);border-color:rgba(103,232,249,.95);transform:translateY(-50%) scale(1.06)}.nav svg{display:block;width:28px;height:28px;stroke:#fff;stroke-width:3.2;fill:none;filter:drop-shadow(0 0 5px rgba(103,232,249,.85));pointer-events:none}
    .actions{position:fixed;top:14px;left:14px;z-index:90;display:flex;gap:8px;flex-wrap:wrap}.action{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:10px 14px;background:rgba(5,10,20,.8);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em;cursor:pointer}.action.primary{background:linear-gradient(135deg,#0891b2,#2563eb)}
    .dot{width:8px;height:8px;border:0;border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;transition:.2s}.dot.active{width:24px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
    .card-hover{transition:.25s}.card-hover:hover{transform:translateY(-4px);border-color:rgba(103,232,249,.36)}
    .module{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:999px;color:#a5f3fc;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.22);font-size:11px;font-weight:900;letter-spacing:.12em}
    .flow{position:relative;padding-left:48px}.flow:before{content:"";position:absolute;left:18px;top:38px;bottom:-18px;width:2px;background:linear-gradient(var(--cyan),rgba(59,130,246,.1))}.flow:last-child:before{display:none}.flow-n{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#06b6d4,#2563eb)}
    @media(max-width:768px){.slide{padding:5.5rem .85rem 5.5rem}.logo{width:68px;height:68px}.iec-logo{height:62px}.action{font-size:9px;padding:9px 10px}.nav{width:40px;height:40px}}
    @media(max-width:640px){.nav{top:auto;bottom:14px;transform:none}.nav:hover{transform:scale(1.06)}#prev{left:14px!important}#next{right:14px!important}#dots{bottom:28px!important;max-width:calc(100vw - 120px)}}
    @media print{body{overflow:visible}.actions,.nav,#dots,#counter{display:none!important}.slide{display:flex!important;width:100vw;height:100vh;min-height:100vh;overflow:hidden;page-break-after:always}}
  </style>
</head>
<body>
  <div class="actions">
    <button class="action" onclick="toggleFullscreen()"><i data-lucide="maximize-2" class="w-4 h-4"></i> PANTALLA COMPLETA</button>
    <button class="action" onclick="window.print()"><i data-lucide="printer" class="w-4 h-4"></i> IMPRIMIR</button>
  </div>
  <button id="prev" class="nav left-3 md:left-5" onclick="changeSlide(-1)" aria-label="Diapositiva anterior" title="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="next" class="nav right-3 md:right-5" onclick="changeSlide(1)" aria-label="Diapositiva siguiente" title="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="dots" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex gap-2 flex-wrap justify-center"></div>
  <div id="counter" class="fixed top-4 right-4 z-[80] px-3 py-1.5 rounded-full bg-black/30 border border-white/10 text-xs text-slate-300"></div>
  <main id="presentation"></main>

<script>
const INAES='https://i.postimg.cc/L5NSxz5m/images-(8).png';
const IEC='https://i.postimg.cc/jSkQKpRK/Diseno-sin-titulo-2026-05-15T105828-195.png';
const bullets=a=>`<ul class="space-y-2 text-slate-300">${a.map(x=>`<li>• ${x}</li>`).join('')}</ul>`;
const cards=(a,cols='md:grid-cols-3')=>`<div class="grid grid-cols-2 ${cols} gap-4">${a.map(x=>`<div class="glass card-hover rounded-2xl p-5"><div class="text-4xl">${x[0]}</div><h3 class="font-black text-lg mt-3">${x[1]}</h3><p class="text-slate-400 text-sm mt-2">${x[2]}</p></div>`).join('')}</div>`;
const logos=()=>`<div class="flex items-center justify-center gap-6 md:gap-9 mb-7"><img src="${INAES}" alt="INAES" class="logo bg-white rounded-2xl p-2"><div class="h-16 w-px bg-white/20"></div><img src="${IEC}" alt="Instituto IEC" class="iec-logo"></div>`;
const shell=(eyebrow,title,body,center=false)=>`<section class="slide flex-col items-center justify-center bg-gradient-to-b from-[#060a12] to-[#0b1426] ${center?'text-center':''}"><div class="absolute inset-0 bg-pattern opacity-70"></div><div class="relative z-10 max-w-6xl mx-auto w-full px-3"><span class="text-cyan-300 font-bold tracking-widest text-sm">${eyebrow}</span><h2 class="text-3xl sm:text-4xl md:text-6xl font-black mt-2 mb-6 leading-[1.02]">${title}</h2>${body}</div></section>`;
const modulePair=(n1,t1,l1,w1,n2,t2,l2,w2)=>`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><div class="module">${n1} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t1}</h3>${bullets(l1)}<div class="mt-4 p-3 rounded-xl bg-cyan-400/10 border border-cyan-400/20"><b class="text-cyan-200">Taller:</b> ${w1}</div></div><div class="glass rounded-3xl p-6"><div class="module">${n2} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t2}</h3>${bullets(l2)}<div class="mt-4 p-3 rounded-xl bg-blue-400/10 border border-blue-400/20"><b class="text-blue-200">Taller:</b> ${w2}</div></div></div>`;

const slides=[

`<section class="slide active flex-col items-center justify-center text-center bg-gradient-to-br from-[#060a12] via-[#0b162b] to-[#060a12]"><div class="absolute inset-0 bg-pattern"></div><div class="relative z-10 max-w-6xl px-3">${logos()}<div class="inline-flex px-4 py-2 rounded-full border border-cyan-400/25 bg-cyan-400/10 text-cyan-200 text-xs md:text-sm font-bold tracking-[.14em] uppercase mb-5">Propuesta presentada ante INAES Entre Ríos para su articulación y difusión</div><h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black leading-[.93] mb-5">INTELIGENCIA OPERATIVA<br><span class="gradient-text">PARA LA ECONOMÍA SOCIAL</span></h1><p class="text-lg md:text-2xl text-slate-300 max-w-5xl mx-auto mb-7">Programa dirigido específicamente a los equipos administrativos de cooperativas y mutuales, con INAES Entre Ríos como nexo institucional para acercar, articular y difundir la propuesta.</p><div class="flex flex-wrap justify-center gap-3"><span class="pill px-4 py-2 rounded-xl text-cyan-200">10 módulos</span><span class="pill px-4 py-2 rounded-xl text-blue-200">20 horas</span><span class="pill px-4 py-2 rounded-xl text-violet-200">Modalidad híbrida</span><span class="pill px-4 py-2 rounded-xl text-green-200">Proyecto aplicado</span></div></div></section>`,

shell('01 · ENCUADRE DE LA PROPUESTA','UNA CAPACITACIÓN DIRIGIDA A<br><span class="gradient-text">LAS MUTUALES Y COOPERATIVAS</span>',`<div class="glass rounded-3xl p-7"><p class="text-lg md:text-xl text-slate-200 leading-relaxed">La propuesta se presenta ante INAES Entre Ríos para que el organismo pueda actuar como nexo institucional, acercándola y difundiéndola entre las cooperativas y mutuales de su ámbito. Los destinatarios directos son los equipos administrativos, responsables de áreas y autoridades de cada entidad participante.</p></div><div class="grid md:grid-cols-3 gap-4 mt-5">${[['🏛️','INAES articula','Acerca la propuesta al sector y facilita su difusión institucional.'],['🤝','Las entidades participan','Cada cooperativa o mutual inscribe a sus equipos y selecciona procesos reales.'],['🚀','IEC capacita','Diseña, dicta, acompaña y evalúa el trayecto formativo.']].map(x=>`<div class="glass rounded-2xl p-5 text-center"><div class="text-4xl">${x[0]}</div><h3 class="font-black mt-3">${x[1]}</h3><p class="text-slate-400 mt-2">${x[2]}</p></div>`).join('')}</div>`),

shell('02 · PUNTO DE PARTIDA','LA ADMINISTRACIÓN NO ES UN ÁREA AUXILIAR.<br><span class="gradient-text">ES EL SISTEMA QUE CONECTA TODA LA ENTIDAD.</span>',`<p class="text-slate-300 text-lg md:text-xl leading-relaxed mb-6">Desde la incorporación de asociados hasta la rendición de cuentas, cada decisión institucional atraviesa formularios, documentos, registros, controles, comunicaciones y responsables. Cuando esos circuitos no están ordenados, aumenta el tiempo, el error y la pérdida de información.</p>${cards([['👥','Asociados','Altas, bajas, legajos, beneficios y consultas.'],['📑','Documentación','Actas, libros, estatutos, reglamentos y archivos.'],['💳','Administración','Cuotas, cobranzas, pagos, facturación y tesorería.'],['📊','Gestión','Reportes, indicadores, presupuestos y decisiones.'],['🔎','Control','Auditorías, balances, rendiciones y cumplimiento.'],['📣','Comunicación','Convocatorias, avisos, campañas y atención.']], 'md:grid-cols-3')}`),

shell('03 · DESAFÍOS FRECUENTES','CUANDO LOS PROCESOS CRECEN,<br><span class="amber-text">LA COMPLEJIDAD TAMBIÉN CRECE</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-red-300 font-black text-xl mb-4">Situaciones habituales</h3>${bullets(['Información distribuida entre correos, planillas y carpetas.','Carga manual y duplicada de datos.','Seguimientos sostenidos por memoria o mensajes.','Documentación con versiones diferentes.','Consultas repetitivas de asociados y proveedores.','Dificultad para consolidar indicadores.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/20"><h3 class="text-cyan-300 font-black text-xl mb-4">Consecuencias</h3>${cards([['⏱️','Demoras','Los trámites tardan más de lo necesario.'],['⚠️','Errores','Aumentan inconsistencias y omisiones.'],['🔁','Retrabajo','Se repiten controles y cargas.'],['📉','Baja trazabilidad','Cuesta conocer estados y responsables.']], 'md:grid-cols-2')}</div></div>`),

shell('04 · DIFERENCIAL','EN UN MUNDO DONDE TODOS HABLAN DE IA,<br><span class="gradient-text">NOSOTROS HABLAMOS DE INTELIGENCIA OPERATIVA</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-blue-300 text-2xl font-black mb-4">INTELIGENCIA ARTIFICIAL</h3>${bullets(['Redacta un correo.','Resume un documento.','Ordena información.','Responde una consulta.','Ayuda en una tarea puntual.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/25"><h3 class="text-cyan-300 text-2xl font-black mb-4">INTELIGENCIA OPERATIVA</h3>${bullets(['Analiza el proceso completo.','Define roles, datos y decisiones.','Integra IA, automatización y procedimientos.','Genera alertas, trazabilidad e indicadores.','Convierte herramientas aisladas en un sistema de trabajo.'])}</div></div><div class="glass rounded-2xl p-5 mt-5 text-center"><p class="text-xl md:text-3xl font-black">La IA ejecuta tareas. <span class="gradient-text">La IO mejora cómo funciona la organización.</span></p></div>`,true),

shell('05 · DESTINATARIOS','UNA FORMACIÓN PARA QUIENES SOSTIENEN<br><span class="gradient-text">LA OPERACIÓN DIARIA DE LA ENTIDAD</span>',cards([['👩‍💼','Personal administrativo','Recepción, secretaría, archivo y atención.'],['💰','Tesorería y contabilidad','Cobranzas, pagos, conciliaciones y reportes.'],['📑','Consejo y conducción','Seguimiento, documentación y toma de decisiones.'],['👥','Gestión de asociados','Altas, bajas, beneficios y comunicación.'],['🧾','Facturación y compras','Comprobantes, proveedores y circuitos internos.'],['📊','Coordinaciones','Responsables de áreas, proyectos y equipos.']], 'md:grid-cols-3')),

shell('06 · OBJETIVO GENERAL','TRANSFORMAR TAREAS AISLADAS EN<br><span class="gradient-text">PROCESOS ORDENADOS, MEDIBLES Y MEJORABLES</span>',`<div class="glass rounded-3xl p-7 mb-5"><p class="text-lg md:text-xl text-slate-200 leading-relaxed">Capacitar a los equipos administrativos de cooperativas y mutuales para analizar, estandarizar y optimizar sus procesos mediante herramientas digitales, Inteligencia Artificial, automatización e Inteligencia Operativa.</p></div><div class="grid md:grid-cols-2 gap-3">${['Identificar tareas repetitivas y puntos críticos.','Mapear procesos de principio a fin.','Organizar documentos y bases de conocimiento.','Mejorar atención y comunicación institucional.','Automatizar alertas, formularios y seguimientos.','Construir indicadores para la toma de decisiones.','Aplicar criterios de seguridad y confidencialidad.','Diseñar una mejora concreta para un proceso real.'].map(x=>`<div class="pill rounded-xl p-4">✔ ${x}</div>`).join('')}</div>`),

shell('07 · PROCESOS ABORDADOS','LOS CIRCUITOS QUE INTEGRAN<br><span class="gradient-text">LA VIDA ADMINISTRATIVA DE UNA ENTIDAD</span>',cards([['👥','Asociados','Admisión, legajos, cuotas, beneficios y bajas.'],['📘','Libros y actas','Reuniones, asambleas, resoluciones y archivo.'],['🏛️','Gobierno institucional','Consejo, autoridades, mandatos y responsabilidades.'],['💳','Cobranzas','Cuotas sociales, mora, recibos y conciliaciones.'],['🧾','Facturación','Comprobantes, prestaciones, compras y proveedores.'],['💰','Tesorería','Pagos, caja, bancos y programación financiera.'],['📦','Compras e inventario','Solicitudes, autorizaciones, stock y control.'],['📣','Comunicación','Convocatorias, campañas, avisos y consultas.'],['🔎','Control y cumplimiento','Balances, auditorías, rendiciones y vencimientos.'],['📊','Gestión y reportes','Indicadores, presupuestos y análisis.'],['🤝','Servicios al asociado','Solicitudes, reclamos y seguimiento.'],['🎓','Capacitación','Inscripción, asistencia, evaluación y certificación.']], 'md:grid-cols-4')),

shell('08 · MODELO DE TRABAJO','DE LA SOLICITUD AL RESULTADO:<br><span class="gradient-text">UN FLUJO ADMINISTRATIVO TRAZABLE</span>',`<div class="grid md:grid-cols-7 gap-3">${[['1','Ingreso'],['2','Validación'],['3','Registro'],['4','Asignación'],['5','Resolución'],['6','Notificación'],['7','Archivo']].map(x=>`<div class="glass rounded-2xl p-4 text-center"><div class="number-badge w-11 h-11 rounded-full grid place-items-center mx-auto font-black">${x[0]}</div><h3 class="font-black mt-3 text-sm">${x[1]}</h3></div>`).join('')}</div><div class="glass rounded-3xl p-6 mt-6 text-center"><p class="text-lg md:text-2xl font-black">Cada paso debe tener una entrada, un responsable, una decisión, un plazo y un resultado verificable.</p></div>`),

shell('09 · METODOLOGÍA','CAPACITACIÓN PRÁCTICA,<br><span class="gradient-text">SITUADA Y ORIENTADA A RESULTADOS</span>',`<div class="grid md:grid-cols-3 gap-4">${[['📘','Conceptos claros','Fundamentos sin tecnicismos innecesarios.'],['🖥️','Demostraciones','Herramientas aplicadas en vivo.'],['🛠️','Talleres','Trabajo sobre procesos reales.']].map(x=>`<div class="glass rounded-3xl p-6 text-center card-hover"><div class="text-5xl">${x[0]}</div><h3 class="text-xl font-black mt-4">${x[1]}</h3><p class="text-slate-300 mt-2">${x[2]}</p></div>`).join('')}</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">${['Casos cooperativos','Casos mutuales','Trabajo colaborativo','Proyecto integrador'].map(x=>`<div class="pill rounded-xl p-4 text-center">${x}</div>`).join('')}</div><div class="mt-5 p-5 rounded-2xl bg-green-400/10 border border-green-400/25 text-center"><p class="text-green-100 font-bold text-lg">Cada clase produce un recurso que puede reutilizarse en la tarea cotidiana.</p></div>`),

shell('10 · ORGANIZACIÓN ACADÉMICA','UNA PROPUESTA FLEXIBLE PARA<br><span class="gradient-text">ALCANZAR A ENTIDADES DE TODO EL TERRITORIO</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-7 text-center"><div class="text-6xl">🏛️</div><h3 class="text-cyan-300 text-2xl font-black mt-4">PRESENCIAL</h3><p class="text-slate-300 mt-3">Encuentros en sedes acordadas, con laboratorio práctico y acompañamiento directo.</p></div><div class="glass rounded-3xl p-7 text-center border-blue-400/20"><div class="text-6xl">💻</div><h3 class="text-blue-300 text-2xl font-black mt-4">VIRTUAL EN VIVO</h3><p class="text-slate-300 mt-3">Participación sincrónica para equipos de diferentes localidades.</p></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5"><div class="pill rounded-xl p-4 text-center"><strong>10</strong><br><span class="text-slate-400 text-sm">encuentros</span></div><div class="pill rounded-xl p-4 text-center"><strong>2 h</strong><br><span class="text-slate-400 text-sm">por encuentro</span></div><div class="pill rounded-xl p-4 text-center"><strong>20 h</strong><br><span class="text-slate-400 text-sm">carga total</span></div><div class="pill rounded-xl p-4 text-center"><strong>Híbrida</strong><br><span class="text-slate-400 text-sm">alcance territorial</span></div></div>`),

shell('11 · DESARROLLO CURRICULAR','MÓDULOS 1 Y 2 · <span class="gradient-text">BASES DE LA INTELIGENCIA OPERATIVA</span>',modulePair('01','La administración en la Economía Social',['Rol estratégico del equipo administrativo.','Relación entre conducción, asociados y áreas.','Procesos, datos, documentos y decisiones.','Digitalización, IA e Inteligencia Operativa.','Detección de tareas repetitivas y riesgos.'],'Mapa inicial de la operación administrativa.','02','Mapeo y estandarización de procesos',['Cómo representar un proceso de principio a fin.','Responsables, entradas, decisiones y resultados.','Checklists y procedimientos.','Detección de demoras y duplicaciones.','Diseño de circuitos claros.'],'Rediseño de un proceso seleccionado.')),

shell('12 · DESARROLLO CURRICULAR','MÓDULOS 3 Y 4 · <span class="gradient-text">ASOCIADOS Y DOCUMENTACIÓN</span>',modulePair('03','Gestión inteligente de asociados',['Altas, bajas y actualización de datos.','Legajos y documentación respaldatoria.','Cuotas, beneficios y estado de cuenta.','Segmentación y comunicación.','Seguimiento de solicitudes.'],'Modelo de legajo y tablero de asociados.','04','Gestión documental inteligente',['Clasificación y nomenclatura.','Actas, estatutos, reglamentos y balances.','Control de versiones.','Búsqueda y resumen con IA.','Alertas de vencimiento.'],'Base de conocimiento documental.')),

shell('13 · DESARROLLO CURRICULAR','MÓDULOS 5 Y 6 · <span class="gradient-text">COMUNICACIÓN Y ADMINISTRACIÓN ECONÓMICA</span>',modulePair('05','Comunicación institucional asistida por IA',['Correos, circulares y convocatorias.','Atención por WhatsApp y canales institucionales.','Respuestas frecuentes y protocolos.','Prompts reutilizables.','Validación humana y tono institucional.'],'Biblioteca de comunicaciones modelo.','06','Cobranzas, pagos y conciliaciones',['Cuotas sociales y mora.','Recibos y comprobantes.','Caja, bancos y conciliación.','Seguimiento de proveedores y pagos.','Indicadores financieros básicos.'],'Tablero de cobranzas y compromisos.')),

document.getElementById('presentation').innerHTML=slides.join('');
let current=0;const els=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots'),counter=document.getElementById('counter');
function track(n,p={}){if(typeof gtag==='function')gtag('event',n,p)}
function init(){els.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>show(i);b.setAttribute('aria-label','Ir a diapositiva '+(i+1));dots.appendChild(b)});show(0);lucide?.createIcons()}
function show(i){current=(i+els.length)%els.length;els.forEach((s,j)=>{s.classList.toggle('active',j===current);if(j===current)s.scrollTop=0});[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===current));counter.textContent=`${current+1} / ${els.length}`;track('slide_view',{presentation:'programa_entidades_economia_social_io',slide_number:current+1})}
function changeSlide(d){show(current+d)}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();track('presentation_fullscreen',{presentation:'programa_entidades_economia_social_io'})}else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();changeSlide(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();changeSlide(-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1);if(e.key.toLowerCase()==='f')toggleFullscreen()});
let tx=null;document.addEventListener('touchstart',e=>tx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].screenX-tx;if(Math.abs(d)>60)changeSlide(d<0?1:-1);tx=null},{passive:true});
window.addEventListener('load',init);

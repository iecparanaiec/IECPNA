<!doctype html>
<html lang="es">
<head>
  <!-- Google Analytics IEC -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R817QWH97R"></script>

    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
    gtag('js',new Date());gtag('config','G-R817QWH97R');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Propuesta de implementación de Smarteo para cooperativas y mutuales de la Red INAES, desarrollada por Instituto IEC y Co+nexus bajo el enfoque de Inteligencia Operativa.">
  <title>Smarteo para Cooperativas y Mutuales | Red INAES + IEC + Co+nexus</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--bg:#060a12;--panel:#0d1526}
    *{box-sizing:border-box;font-family:'DM Sans',sans-serif}html,body{margin:0;background:var(--bg)}body{color:#fff;overflow:hidden}button{font:inherit}
    .slide{display:none;width:100%;height:100vh;min-height:100vh;overflow-y:auto;overflow-x:hidden;padding:5.4rem 1.5rem 5.3rem;position:relative}.slide.active{display:flex}
    .bg-pattern{background-image:radial-gradient(circle at 15% 15%,rgba(34,211,238,.12),transparent 25%),radial-gradient(circle at 85% 78%,rgba(139,92,246,.13),transparent 30%),linear-gradient(90deg,rgba(59,130,246,.05) 1px,transparent 1px),linear-gradient(rgba(59,130,246,.05) 1px,transparent 1px);background-size:auto,auto,52px 52px,52px 52px}
    .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 70px rgba(0,0,0,.24)}
    .pill{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
    .gradient-text{background:linear-gradient(135deg,#67e8f9,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .green-text{background:linear-gradient(135deg,#86efac,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .amber-text{background:linear-gradient(135deg,#fde68a,#f59e0b,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo{width:95px;height:95px;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}.iec-logo{height:90px;max-width:230px;object-fit:contain}
    .nav{position:fixed;top:50%;z-index:80;transform:translateY(-50%);width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.92);border:1px solid rgba(103,232,249,.55);box-shadow:0 12px 32px rgba(0,0,0,.38),0 0 0 1px rgba(34,211,238,.08) inset;backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s ease}.nav:hover{background:rgba(8,145,178,.32);border-color:rgba(103,232,249,.95);transform:translateY(-50%) scale(1.06)}.nav svg{display:block;width:28px;height:28px;stroke:#fff;stroke-width:3.2;fill:none;filter:drop-shadow(0 0 5px rgba(103,232,249,.85));pointer-events:none}
    .actions{position:fixed;top:14px;left:14px;z-index:90;display:flex;gap:8px;flex-wrap:wrap}.action{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:10px 14px;background:rgba(5,10,20,.8);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em;cursor:pointer}.action.primary{background:linear-gradient(135deg,#0891b2,#2563eb)}
    .dot{width:8px;height:8px;border:0;border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;transition:.2s}.dot.active{width:24px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
    .card-hover{transition:.25s}.card-hover:hover{transform:translateY(-4px);border-color:rgba(103,232,249,.36)}
    .module{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:999px;color:#a5f3fc;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.22);font-size:11px;font-weight:900;letter-spacing:.12em}
    .flow{position:relative;padding-left:48px}.flow:before{content:"";position:absolute;left:18px;top:38px;bottom:-18px;width:2px;background:linear-gradient(var(--cyan),rgba(59,130,246,.1))}.flow:last-child:before{display:none}.flow-n{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#06b6d4,#2563eb)}
    @media(max-width:768px){.slide{padding:5.5rem .85rem 5.5rem}.logo{width:68px;height:68px}.iec-logo{height:62px}.action{font-size:9px;padding:9px 10px}.nav{width:40px;height:40px}}
    @media(max-width:640px){.nav{top:auto;bottom:14px;transform:none}.nav:hover{transform:scale(1.06)}#prev{left:14px!important}#next{right:14px!important}#dots{bottom:28px!important;max-width:calc(100vw - 120px)}}
    @media print{body{overflow:visible}.actions,.nav,#dots,#counter{display:none!important}.slide{display:flex!important;width:100vw;height:100vh;min-height:100vh;overflow:hidden;page-break-after:always}}
  </style>
</head>
<body>
  <div class="actions">
    <button class="action" onclick="toggleFullscreen()"><i data-lucide="maximize-2" class="w-4 h-4"></i> PANTALLA COMPLETA</button>
    <button class="action" onclick="window.print()"><i data-lucide="printer" class="w-4 h-4"></i> IMPRIMIR</button>
  </div>
  <button id="prev" class="nav left-3 md:left-5" onclick="changeSlide(-1)" aria-label="Diapositiva anterior" title="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="next" class="nav right-3 md:right-5" onclick="changeSlide(1)" aria-label="Diapositiva siguiente" title="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="dots" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex gap-2 flex-wrap justify-center"></div>
  <div id="counter" class="fixed top-4 right-4 z-[80] px-3 py-1.5 rounded-full bg-black/30 border border-white/10 text-xs text-slate-300"></div>
  <main id="presentation"></main>

<script>
const INAES='https://i.postimg.cc/L5NSxz5m/images-(8).png';
const IEC='https://i.postimg.cc/jSkQKpRK/Diseno-sin-titulo-2026-05-15T105828-195.png';
const CONEXUS='https://i.postimg.cc/7ZZk1XGm/Logo-co-nexus-t.png';
const bullets=a=>`<ul class="space-y-2 text-slate-300">${a.map(x=>`<li>• ${x}</li>`).join('')}</ul>`;
const cards=(a,cols='md:grid-cols-3')=>`<div class="grid grid-cols-2 ${cols} gap-4">${a.map(x=>`<div class="glass card-hover rounded-2xl p-5"><div class="text-4xl">${x[0]}</div><h3 class="font-black text-lg mt-3">${x[1]}</h3><p class="text-slate-400 text-sm mt-2">${x[2]}</p></div>`).join('')}</div>`;
const logos=()=>`<div class="flex items-center justify-center gap-4 md:gap-7 mb-7 flex-wrap"><img src="${INAES}" alt="INAES" class="logo bg-white rounded-2xl p-2"><div class="h-16 w-px bg-white/20 hidden sm:block"></div><img src="${IEC}" alt="Instituto IEC" class="iec-logo"><div class="h-16 w-px bg-white/20 hidden sm:block"></div><img src="${CONEXUS}" alt="Co+nexus" class="h-14 md:h-16 object-contain"></div>`;
const shell=(eyebrow,title,body,center=false)=>`<section class="slide flex-col items-center justify-center bg-gradient-to-b from-[#060a12] to-[#0b1426] ${center?'text-center':''}"><div class="absolute inset-0 bg-pattern opacity-70"></div><div class="relative z-10 max-w-6xl mx-auto w-full px-3"><span class="text-cyan-300 font-bold tracking-widest text-sm">${eyebrow}</span><h2 class="text-3xl sm:text-4xl md:text-6xl font-black mt-2 mb-6 leading-[1.02]">${title}</h2>${body}</div></section>`;
const modulePair=(n1,t1,l1,w1,n2,t2,l2,w2)=>`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><div class="module">${n1} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t1}</h3>${bullets(l1)}<div class="mt-4 p-3 rounded-xl bg-cyan-400/10 border border-cyan-400/20"><b class="text-cyan-200">Taller:</b> ${w1}</div></div><div class="glass rounded-3xl p-6"><div class="module">${n2} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t2}</h3>${bullets(l2)}<div class="mt-4 p-3 rounded-xl bg-blue-400/10 border border-blue-400/20"><b class="text-blue-200">Taller:</b> ${w2}</div></div></div>`;

const slides=[

`<section class="slide active flex-col items-center justify-center text-center bg-gradient-to-br from-[#060a12] via-[#0b162b] to-[#060a12]"><div class="absolute inset-0 bg-pattern"></div><div class="relative z-10 max-w-6xl px-3">${logos()}<div class="inline-flex px-4 py-2 rounded-full border border-cyan-400/25 bg-cyan-400/10 text-cyan-200 text-xs md:text-sm font-bold tracking-[.14em] uppercase mb-5">Propuesta para cooperativas y mutuales de la Red INAES</div><h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black leading-[.93] mb-5">SMARTEO DE<br><span class="gradient-text">ORGANIZACIONES DE LA ECONOMÍA SOCIAL</span></h1><p class="text-lg md:text-2xl text-slate-300 max-w-5xl mx-auto mb-7">Un modelo de transformación basado en Inteligencia Operativa para ordenar procesos, integrar información, automatizar tareas y fortalecer la capacidad institucional de cooperativas y mutuales.</p><div class="flex flex-wrap justify-center gap-3"><span class="pill px-4 py-2 rounded-xl text-cyan-200">Diagnóstico</span><span class="pill px-4 py-2 rounded-xl text-blue-200">Rediseño</span><span class="pill px-4 py-2 rounded-xl text-violet-200">Tecnología</span><span class="pill px-4 py-2 rounded-xl text-green-200">Acompañamiento</span></div></div></section>`,

shell('01 · ENCUADRE','UNA PROPUESTA PARA TRANSFORMAR<br><span class="gradient-text">LA OPERACIÓN REAL DE CADA ENTIDAD</span>',`<div class="glass rounded-3xl p-7"><p class="text-lg md:text-xl text-slate-200 leading-relaxed">Esta propuesta se presenta ante INAES para que pueda articularla con cooperativas y mutuales interesadas en modernizar su gestión. El Smarteo no es un curso ni una instalación aislada: es un proceso de diagnóstico, rediseño e implementación que trabaja sobre la operación concreta de cada organización.</p></div><div class="grid md:grid-cols-3 gap-4 mt-5">${[['🏛️','INAES articula','Conecta la propuesta con las entidades de su red.'],['🧭','Co+nexus acompaña','Releva, ordena y conduce el proceso de transformación.'],['⚙️','IEC implementa','Diseña e integra tecnología, automatización e Inteligencia Operativa.']].map(x=>`<div class="glass rounded-2xl p-5 text-center"><div class="text-4xl">${x[0]}</div><h3 class="font-black mt-3">${x[1]}</h3><p class="text-slate-400 mt-2">${x[2]}</p></div>`).join('')}</div>`),

shell('02 · ¿QUÉ ES SMARTEO?','NO ES DIGITALIZAR POR DIGITALIZAR.<br><span class="gradient-text">ES TRANSFORMAR CÓMO FUNCIONA LA ORGANIZACIÓN.</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-cyan-300 text-2xl font-black mb-4">Smarteo</h3><p class="text-slate-300 leading-relaxed">Es un modelo de transformación organizacional que analiza personas, procesos, datos, documentos, activos y tecnología para convertirlos en un sistema integrado, trazable y capaz de aprender.</p></div><div class="glass rounded-3xl p-6 border-violet-400/20"><h3 class="text-violet-300 text-2xl font-black mb-4">Resultado esperado</h3>${bullets(['Menos tareas repetitivas.','Información centralizada.','Procesos con responsables y plazos.','Alertas e indicadores en tiempo real.','Mejor capacidad para decidir y servir a los asociados.'])}</div></div><div class="glass rounded-2xl p-5 mt-5 text-center"><p class="text-xl md:text-3xl font-black">Smartear es pasar de herramientas aisladas a <span class="gradient-text">una organización que interpreta, anticipa y ejecuta.</span></p></div>`),

shell('03 · EL PROBLEMA ACTUAL','MUCHAS ENTIDADES TIENEN TECNOLOGÍA,<br><span class="amber-text">PERO NO TIENEN LOS PROCESOS INTEGRADOS</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-red-300 font-black text-xl mb-4">Situaciones frecuentes</h3>${bullets(['Planillas diferentes para un mismo dato.','Documentos dispersos entre correos y carpetas.','Procesos sostenidos por memoria o WhatsApp.','Información duplicada y sin responsable claro.','Sistemas que no se comunican entre sí.','Decisiones tomadas sin indicadores consolidados.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/20"><h3 class="text-cyan-300 font-black text-xl mb-4">Impacto</h3>${cards([['⏱️','Demoras','Los trámites y respuestas tardan más.'],['⚠️','Errores','Aumentan omisiones y registros inconsistentes.'],['🔁','Retrabajo','Se repiten cargas y controles.'],['📉','Pérdida de capacidad','La organización no aprovecha su información.']], 'md:grid-cols-2')}</div></div>`),

shell('04 · INTELIGENCIA OPERATIVA','LA IA ES UNA HERRAMIENTA.<br><span class="gradient-text">LA INTELIGENCIA OPERATIVA ES EL SISTEMA.</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-blue-300 text-2xl font-black mb-4">Inteligencia Artificial</h3>${bullets(['Redacta documentos.','Resume información.','Clasifica datos.','Responde consultas.','Ayuda en tareas puntuales.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/25"><h3 class="text-cyan-300 text-2xl font-black mb-4">Inteligencia Operativa</h3>${bullets(['Conecta procesos y responsables.','Integra datos y documentos.','Activa automatizaciones.','Genera alertas e indicadores.','Sostiene decisiones y mejora continua.'])}</div></div><div class="glass rounded-2xl p-5 mt-5 text-center"><p class="text-xl md:text-3xl font-black">IO = Personas + Procesos + Datos + Tecnología + Gobernanza</p></div>`,true),

shell('05 · PIRÁMIDE DEL SMARTEO','UN CAMINO PROGRESIVO DESDE LOS DATOS<br><span class="gradient-text">HASTA LA CAPACIDAD DE DECISIÓN</span>',`<div class="max-w-4xl mx-auto space-y-3">${[['5','GOBERNANZA','Reglas, indicadores, responsables y mejora continua.'],['4','AUTOMATIZACIÓN','Flujos que ejecutan tareas y alertas.'],['3','INTELIGENCIA','Análisis, IA, clasificación y predicción.'],['2','INTEGRACIÓN','Sistemas, documentos y áreas conectadas.'],['1','CAPTURA','Datos confiables desde el origen.']].map((x,i)=>`<div class="glass rounded-2xl p-4 md:p-5 flex items-center gap-4" style="margin-left:${i*28}px;margin-right:${i*28}px"><div class="number-badge w-12 h-12 rounded-full grid place-items-center font-black">${x[0]}</div><div><h3 class="font-black text-cyan-300">${x[1]}</h3><p class="text-slate-300">${x[2]}</p></div></div>`).join('')}</div>`),

shell('06 · ¿QUÉ ANALIZAMOS?','EL SMARTEO OBSERVA<br><span class="gradient-text">LA ORGANIZACIÓN COMO UN ECOSISTEMA</span>',cards([['👥','Personas','Roles, responsabilidades, capacidades y comunicación.'],['⚙️','Procesos','Pasos, decisiones, tiempos, controles y excepciones.'],['📊','Datos','Origen, calidad, duplicación, uso y disponibilidad.'],['📑','Documentos','Versiones, acceso, vencimientos y trazabilidad.'],['🏢','Activos','Equipos, infraestructura, inventario y mantenimiento.'],['💻','Tecnología','Sistemas, integraciones, automatización e IA.'],['📈','Indicadores','Resultados, productividad, cumplimiento y servicio.'],['🔐','Gobernanza','Permisos, seguridad, auditoría y continuidad.']], 'md:grid-cols-4')),

shell('07 · PROCESOS OBJETIVO','EL SMARTEO SE APLICA SOBRE<br><span class="gradient-text">LOS PROCESOS QUE SOSTIENEN LA ENTIDAD</span>',cards([['👥','Asociados','Altas, bajas, legajos, cuotas y beneficios.'],['📘','Gobierno institucional','Actas, autoridades, mandatos y asambleas.'],['💳','Cobranzas','Mora, recibos, seguimiento y conciliaciones.'],['💰','Tesorería','Caja, bancos, pagos y programación financiera.'],['🧾','Facturación','Comprobantes, prestaciones y proveedores.'],['📦','Compras e inventario','Solicitudes, autorizaciones, stock y activos.'],['📣','Comunicación','Avisos, consultas, campañas y convocatorias.'],['🔎','Cumplimiento','Balances, vencimientos, auditorías y rendiciones.'],['🎓','Capacitación','Inscripción, seguimiento y certificación.'],['🛠️','Servicios al asociado','Solicitudes, turnos, reclamos y resolución.'],['👩‍💼','RR.HH.','Legajos, novedades, licencias y desempeño.'],['📊','Dirección','Indicadores, presupuestos y decisiones.']], 'md:grid-cols-4')),

shell('08 · EJEMPLO DE TRANSFORMACIÓN','DE UN TRÁMITE MANUAL<br><span class="gradient-text">A UN CIRCUITO INTELIGENTE</span>',`<div class="grid md:grid-cols-7 gap-3">${[['1','Solicitud'],['2','Validación'],['3','Registro'],['4','Asignación'],['5','Resolución'],['6','Notificación'],['7','Indicador']].map(x=>`<div class="glass rounded-2xl p-4 text-center"><div class="number-badge w-11 h-11 rounded-full grid place-items-center mx-auto font-black">${x[0]}</div><h3 class="font-black mt-3 text-sm">${x[1]}</h3></div>`).join('')}</div><div class="grid md:grid-cols-2 gap-5 mt-6"><div class="glass rounded-2xl p-5"><h3 class="text-red-300 font-black">ANTES</h3><p class="text-slate-300 mt-2">Mensajes sueltos, carga manual, seguimiento informal y poca visibilidad.</p></div><div class="glass rounded-2xl p-5 border-green-400/20"><h3 class="text-green-300 font-black">DESPUÉS</h3><p class="text-slate-300 mt-2">Formulario único, reglas de validación, responsables, alertas, historial e indicador final.</p></div></div>`),

shell('09 · ETAPA 1','DIAGNÓSTICO OPERATIVO<br><span class="gradient-text">PARA ENTENDER ANTES DE IMPLEMENTAR</span>',`<div class="grid md:grid-cols-3 gap-4">${[['🔍','Relevamiento','Entrevistas, documentos, sistemas y tareas.'],['🗺️','Mapeo','Procesos actuales, roles y puntos de fricción.'],['📊','Línea de base','Tiempos, volúmenes, errores y costos.']].map(x=>`<div class="glass rounded-3xl p-6 text-center"><div class="text-5xl">${x[0]}</div><h3 class="text-xl font-black mt-4">${x[1]}</h3><p class="text-slate-300 mt-2">${x[2]}</p></div>`).join('')}</div><div class="glass rounded-2xl p-5 mt-5"><p class="text-lg text-slate-200 text-center">El diagnóstico determina qué conviene mejorar, qué conviene automatizar y qué no debe tocarse todavía.</p></div>`),

shell('10 · ETAPA 2','DISEÑO DEL MODELO FUTURO<br><span class="gradient-text">CON PERSONAS, REGLAS Y TECNOLOGÍA</span>',cards([['🧭','Proceso objetivo','Cómo debería funcionar el circuito.'],['👥','Roles','Quién hace, aprueba, controla y decide.'],['📑','Documentación','Qué registros y respaldos se necesitan.'],['🔔','Alertas','Qué eventos requieren seguimiento.'],['📊','Indicadores','Cómo se medirá el resultado.'],['🔐','Controles','Permisos, trazabilidad y seguridad.']], 'md:grid-cols-3')),

shell('11 · ETAPA 3','DESARROLLO E INTEGRACIÓN<br><span class="gradient-text">DE LAS SOLUCIONES NECESARIAS</span>',cards([['🗂️','Gestión documental','Repositorios, versiones y búsqueda.'],['🧾','Formularios inteligentes','Captura única y validación automática.'],['⚙️','Automatización','Tareas, avisos, derivaciones y reportes.'],['🤖','Asistentes IA','Consulta, clasificación y soporte interno.'],['📊','Dashboards','Indicadores en tiempo real.'],['🔗','Integraciones','Conexión entre sistemas existentes.']], 'md:grid-cols-3')),

shell('12 · ETAPA 4','IMPLEMENTACIÓN Y PRUEBAS<br><span class="gradient-text">SIN INTERRUMPIR LA OPERACIÓN</span>',`<div class="space-y-5 max-w-5xl">${[['1','Prototipo','Se valida el flujo antes del despliegue.'],['2','Prueba controlada','Se trabaja con un equipo o proceso piloto.'],['3','Ajustes','Se corrigen reglas, pantallas y automatizaciones.'],['4','Despliegue','Se implementa por etapas.'],['5','Monitoreo','Se controla adopción, errores e impacto.']].map(x=>`<div class="flow"><div class="flow-n">${x[0]}</div><div class="glass rounded-2xl p-5"><h3 class="text-xl font-black text-cyan-300">${x[1]}</h3><p class="text-slate-300 mt-2">${x[2]}</p></div></div>`).join('')}</div>`),

shell('13 · ETAPA 5','CAPACITACIÓN Y ADOPCIÓN<br><span class="gradient-text">PARA QUE LA SOLUCIÓN SEA PARTE DEL TRABAJO</span>',cards([['🎓','Formación por rol','Cada persona aprende lo que necesita.'],['📘','Protocolos','Guías y procedimientos reutilizables.'],['🧪','Práctica real','Casos concretos de la entidad.'],['💬','Acompañamiento','Soporte durante la incorporación.'],['📈','Medición de adopción','Uso, errores y necesidades.'],['🔁','Mejora continua','Ajustes a partir de la experiencia.']], 'md:grid-cols-3')),

shell('14 · BENEFICIOS OPERATIVOS','QUÉ CAMBIA CUANDO<br><span class="green-text">LA ORGANIZACIÓN SE SMARTEA</span>',cards([['⏱️','Menos tiempo','Se reducen esperas y cargas repetidas.'],['✅','Menos errores','Validaciones y controles automáticos.'],['🔎','Más trazabilidad','Cada estado y responsable queda registrado.'],['📣','Mejor comunicación','Avisos consistentes y oportunos.'],['📊','Más información','Indicadores accesibles para decidir.'],['👥','Equipos fortalecidos','Mayor autonomía y claridad de roles.'],['💰','Mejor uso de recursos','Menos retrabajo y mejor planificación.'],['🤝','Mejor servicio','Respuestas más rápidas a asociados.']], 'md:grid-cols-4')),

document.getElementById('presentation').innerHTML=slides.join('');
let current=0;const els=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots'),counter=document.getElementById('counter');
function track(n,p={}){if(typeof gtag==='function')gtag('event',n,p)}
function init(){els.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>show(i);b.setAttribute('aria-label','Ir a diapositiva '+(i+1));dots.appendChild(b)});show(0);lucide?.createIcons()}
function show(i){current=(i+els.length)%els.length;els.forEach((s,j)=>{s.classList.toggle('active',j===current);if(j===current)s.scrollTop=0});[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===current));counter.textContent=`${current+1} / ${els.length}`;track('slide_view',{presentation:'smarteo_red_inaes_conexus_iec',slide_number:current+1})}
function changeSlide(d){show(current+d)}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();track('presentation_fullscreen',{presentation:'smarteo_red_inaes_conexus_iec'})}else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();changeSlide(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();changeSlide(-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1);if(e.key.toLowerCase()==='f')toggleFullscreen()});
let tx=null;document.addEventListener('touchstart',e=>tx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].screenX-tx;if(Math.abs(d)>60)changeSlide(d<0?1:-1);tx=null},{passive:true});
window.addEventListener('load',init);
</script>

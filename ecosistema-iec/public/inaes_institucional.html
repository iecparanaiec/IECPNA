<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R817QWH97R"></script>

    gtag('js',new Date());gtag('config','G-R817QWH97R');

  <meta charset="UTF-8">

  <meta name="description" content="Propuesta institucional del Instituto IEC para fortalecer las capacidades administrativas de INAES Entre Ríos mediante Inteligencia Operativa, con proyección de réplica nacional.">
  <title>INAES Entre Ríos + Instituto IEC | Inteligencia Operativa para la Economía Social</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--bg:#060a12;--panel:#0d1526}
    *{box-sizing:border-box;font-family:'DM Sans',sans-serif}html,body{margin:0;background:var(--bg)}body{color:#fff;overflow:hidden}button{font:inherit}
    .slide{display:none;width:100%;height:100vh;min-height:100vh;overflow-y:auto;overflow-x:hidden;padding:5.4rem 1.5rem 5.3rem;position:relative}.slide.active{display:flex}
    .bg-pattern{background-image:radial-gradient(circle at 15% 15%,rgba(34,211,238,.12),transparent 25%),radial-gradient(circle at 85% 78%,rgba(139,92,246,.13),transparent 30%),linear-gradient(90deg,rgba(59,130,246,.05) 1px,transparent 1px),linear-gradient(rgba(59,130,246,.05) 1px,transparent 1px);background-size:auto,auto,52px 52px,52px 52px}
    .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 70px rgba(0,0,0,.24)}
    .pill{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
    .gradient-text{background:linear-gradient(135deg,#67e8f9,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .green-text{background:linear-gradient(135deg,#86efac,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .amber-text{background:linear-gradient(135deg,#fde68a,#f59e0b,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo{width:95px;height:95px;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}.iec-logo{height:90px;max-width:230px;object-fit:contain}
    .nav{position:fixed;top:50%;z-index:80;transform:translateY(-50%);width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.92);border:1px solid rgba(103,232,249,.55);box-shadow:0 12px 32px rgba(0,0,0,.38),0 0 0 1px rgba(34,211,238,.08) inset;backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s ease}.nav:hover{background:rgba(8,145,178,.32);border-color:rgba(103,232,249,.95);transform:translateY(-50%) scale(1.06)}.nav svg{display:block;width:28px;height:28px;stroke:#fff;stroke-width:3.2;fill:none;filter:drop-shadow(0 0 5px rgba(103,232,249,.85));pointer-events:none}
    .actions{position:fixed;top:14px;left:14px;z-index:90;display:flex;gap:8px;flex-wrap:wrap}.action{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:10px 14px;background:rgba(5,10,20,.8);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em;cursor:pointer}.action.primary{background:linear-gradient(135deg,#0891b2,#2563eb)}
    .dot{width:8px;height:8px;border:0;border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;transition:.2s}.dot.active{width:24px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
    .card-hover{transition:.25s}.card-hover:hover{transform:translateY(-4px);border-color:rgba(103,232,249,.36)}
    .module{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:999px;color:#a5f3fc;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.22);font-size:11px;font-weight:900;letter-spacing:.12em}
    .flow{position:relative;padding-left:48px}.flow:before{content:"";position:absolute;left:18px;top:38px;bottom:-18px;width:2px;background:linear-gradient(var(--cyan),rgba(59,130,246,.1))}.flow:last-child:before{display:none}.flow-n{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#06b6d4,#2563eb)}
    @media(max-width:768px){.slide{padding:5.5rem .85rem 5.5rem}.logo{width:68px;height:68px}.iec-logo{height:62px}.action{font-size:9px;padding:9px 10px}.nav{width:40px;height:40px}}
    @media(max-width:640px){.nav{top:auto;bottom:14px;transform:none}.nav:hover{transform:scale(1.06)}#prev{left:14px!important}#next{right:14px!important}#dots{bottom:28px!important;max-width:calc(100vw - 120px)}}
    @media print{body{overflow:visible}.actions,.nav,#dots,#counter{display:none!important}.slide{display:flex!important;width:100vw;height:100vh;min-height:100vh;overflow:hidden;page-break-after:always}}
  </style>
</head>
<body>
  <div class="actions">
    <button class="action" onclick="toggleFullscreen()"><i data-lucide="maximize-2" class="w-4 h-4"></i> PANTALLA COMPLETA</button>
    <button class="action" onclick="window.print()"><i data-lucide="printer" class="w-4 h-4"></i> IMPRIMIR</button>
  </div>
  <button id="prev" class="nav left-3 md:left-5" onclick="changeSlide(-1)" aria-label="Diapositiva anterior" title="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="next" class="nav right-3 md:right-5" onclick="changeSlide(1)" aria-label="Diapositiva siguiente" title="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="dots" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex gap-2 flex-wrap justify-center"></div>
  <div id="counter" class="fixed top-4 right-4 z-[80] px-3 py-1.5 rounded-full bg-black/30 border border-white/10 text-xs text-slate-300"></div>
  <main id="presentation"></main>

<script>
const INAES='https://i.postimg.cc/L5NSxz5m/images-(8).png';
const IEC='https://i.postimg.cc/jSkQKpRK/Diseno-sin-titulo-2026-05-15T105828-195.png';
const bullets=a=>`<ul class="space-y-2 text-slate-300">${a.map(x=>`<li>• ${x}</li>`).join('')}</ul>`;
const cards=(a,cols='md:grid-cols-3')=>`<div class="grid grid-cols-2 ${cols} gap-4">${a.map(x=>`<div class="glass card-hover rounded-2xl p-5"><div class="text-4xl">${x[0]}</div><h3 class="font-black text-lg mt-3">${x[1]}</h3><p class="text-slate-400 text-sm mt-2">${x[2]}</p></div>`).join('')}</div>`;
const logos=()=>`<div class="flex items-center justify-center gap-6 md:gap-9 mb-7"><img src="${INAES}" alt="INAES" class="logo bg-white rounded-2xl p-2"><div class="h-16 w-px bg-white/20"></div><img src="${IEC}" alt="Instituto IEC" class="iec-logo"></div>`;
const shell=(eyebrow,title,body,center=false)=>`<section class="slide flex-col items-center justify-center bg-gradient-to-b from-[#060a12] to-[#0b1426] ${center?'text-center':''}"><div class="absolute inset-0 bg-pattern opacity-70"></div><div class="relative z-10 max-w-6xl mx-auto w-full px-3"><span class="text-cyan-300 font-bold tracking-widest text-sm">${eyebrow}</span><h2 class="text-3xl sm:text-4xl md:text-6xl font-black mt-2 mb-6 leading-[1.02]">${title}</h2>${body}</div></section>`;
const modulePair=(n1,t1,l1,w1,n2,t2,l2,w2)=>`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><div class="module">${n1} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t1}</h3>${bullets(l1)}<div class="mt-4 p-3 rounded-xl bg-cyan-400/10 border border-cyan-400/20"><b class="text-cyan-200">Taller:</b> ${w1}</div></div><div class="glass rounded-3xl p-6"><div class="module">${n2} · MÓDULO</div><h3 class="text-2xl font-black mt-4 mb-3">${t2}</h3>${bullets(l2)}<div class="mt-4 p-3 rounded-xl bg-blue-400/10 border border-blue-400/20"><b class="text-blue-200">Taller:</b> ${w2}</div></div></div>`;

const slides=[
`<section class="slide active flex-col items-center justify-center text-center bg-gradient-to-br from-[#060a12] via-[#0b162b] to-[#060a12]"><div class="absolute inset-0 bg-pattern"></div><div class="relative z-10 max-w-6xl px-3">${logos()}<div class="inline-flex px-4 py-2 rounded-full border border-cyan-400/25 bg-cyan-400/10 text-cyan-200 text-xs md:text-sm font-bold tracking-[.14em] uppercase mb-5">Propuesta institucional · Experiencia piloto</div><h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black leading-[.93] mb-5">INTELIGENCIA OPERATIVA<br><span class="gradient-text">PARA LA ECONOMÍA SOCIAL</span></h1><p class="text-lg md:text-2xl text-slate-300 max-w-5xl mx-auto mb-7">Programa de fortalecimiento administrativo para INAES Entre Ríos, con una metodología proyectada para su futura réplica en distintas reparticiones del país.</p><div class="flex flex-wrap justify-center gap-3"><span class="pill px-4 py-2 rounded-xl text-cyan-200">10 módulos</span><span class="pill px-4 py-2 rounded-xl text-blue-200">20 horas</span><span class="pill px-4 py-2 rounded-xl text-violet-200">Modalidad híbrida</span><span class="pill px-4 py-2 rounded-xl text-green-200">Proyecto aplicado</span></div></div></section>`,
shell('01 · ENCUADRE INSTITUCIONAL','UNA PROPUESTA DE TRABAJO<br><span class="gradient-text">SIN PRESUPONER UN CONVENIO VIGENTE</span>',`<div class="glass rounded-3xl p-7"><p class="text-lg md:text-xl text-slate-200 leading-relaxed">La iniciativa se presenta como una propuesta institucional de capacitación y experiencia piloto para INAES Entre Ríos. No implica la existencia de un convenio actual ni genera compromisos para el organismo. Su propósito es abrir una instancia de evaluación técnica y académica que, de considerarse pertinente, pueda evolucionar hacia futuras formas de colaboración.</p></div><div class="grid md:grid-cols-3 gap-4 mt-5">${[['🧭','Primera etapa','Presentación, análisis y adecuación institucional.'],['🧪','Experiencia piloto','Implementación controlada con alcance provincial.'],['🌎','Proyección futura','Modelo adaptable a otras reparticiones del país.']].map(x=>`<div class="glass rounded-2xl p-5 text-center"><div class="text-4xl">${x[0]}</div><h3 class="font-black mt-3">${x[1]}</h3><p class="text-slate-400 mt-2">${x[2]}</p></div>`).join('')}</div>`),
shell('02 · FUNDAMENTACIÓN','FORTALECER LA ADMINISTRACIÓN ES<br><span class="gradient-text">FORTALECER A COOPERATIVAS Y MUTUALES</span>',`<p class="text-slate-300 text-lg md:text-xl leading-relaxed mb-6">Los equipos administrativos sostienen la recepción documental, el seguimiento de expedientes, la gestión registral, la fiscalización, las notificaciones, la atención y la producción de información institucional. Mejorar esas capacidades impacta directamente en la calidad de respuesta del organismo y en la relación con las entidades de la Economía Social.</p>${cards([['📂','Expedientes','Ingreso, clasificación, derivación, seguimiento y archivo.'],['🏛️','Registro','Constitución, matrículas, autoridades, estatutos y actualizaciones.'],['🔎','Fiscalización','Control documental, inspecciones, observaciones e intimaciones.'],['🤝','Atención','Orientación a cooperativas, mutuales y profesionales.']], 'md:grid-cols-4')}`),
shell('03 · OPORTUNIDAD','EL DESAFÍO NO ES SOLO DIGITALIZAR:<br><span class="amber-text">ES ORGANIZAR MEJOR LA OPERACIÓN</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-red-300 font-black text-xl mb-4">Situaciones que generan complejidad</h3>${bullets(['Información distribuida entre expedientes, correos, sistemas, carpetas y planillas.','Controles manuales y tareas repetitivas.','Documentación incompleta o presentada con criterios diferentes.','Seguimientos que dependen de recordatorios individuales.','Dificultad para consolidar indicadores en tiempo real.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/20"><h3 class="text-cyan-300 font-black text-xl mb-4">Oportunidades de mejora</h3>${bullets(['Estandarizar circuitos y criterios de control.','Automatizar alertas, derivaciones y comunicaciones.','Crear asistentes documentales de consulta interna.','Mejorar trazabilidad, plazos e indicadores.','Liberar tiempo administrativo para tareas de mayor valor.'])}</div></div>`),
shell('04 · DIFERENCIAL','EN UN MUNDO DONDE TODOS HABLAN DE IA,<br><span class="gradient-text">NOSOTROS HABLAMOS DE INTELIGENCIA OPERATIVA</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-6"><h3 class="text-blue-300 font-black text-2xl mb-4">INTELIGENCIA ARTIFICIAL</h3>${bullets(['Resume una norma o documento.','Redacta una comunicación.','Clasifica información.','Responde preguntas.','Asiste una tarea puntual.'])}</div><div class="glass rounded-3xl p-6 border-cyan-400/25"><h3 class="text-cyan-300 font-black text-2xl mb-4">INTELIGENCIA OPERATIVA</h3>${bullets(['Analiza el proceso completo.','Integra personas, datos, documentos y decisiones.','Combina IA, automatización y procedimientos.','Genera trazabilidad, alertas e indicadores.','Convierte herramientas aisladas en un sistema de trabajo.'])}</div></div><div class="glass rounded-2xl p-5 mt-5 text-center text-xl md:text-3xl font-black">La IA es una herramienta. <span class="gradient-text">La IO transforma la operación.</span></div>`,true),
shell('05 · DESTINATARIOS','UNA FORMACIÓN PARA QUIENES SOSTIENEN<br><span class="gradient-text">LOS PROCESOS TODOS LOS DÍAS</span>',cards([['📥','Mesa de entradas','Recepción, registro, control inicial y derivación.'],['📑','Gestión registral','Matrículas, estatutos, autoridades y constancias.'],['⚖️','Áreas técnicas y jurídicas','Análisis, dictámenes, subsanaciones y resoluciones.'],['🔍','Fiscalización','Control, inspección, intimación y seguimiento.'],['☎️','Atención institucional','Consultas, orientación y reclamos.'],['📊','Coordinaciones','Supervisión, prioridades, resultados e indicadores.']], 'md:grid-cols-3')+`<div class="glass rounded-2xl p-5 mt-5 text-center text-slate-200">No se requieren conocimientos previos de programación. El punto de partida son las tareas reales de cada participante.</div>`),
shell('06 · MAPA DE PROCESOS','LOS PRINCIPALES CIRCUITOS<br><span class="gradient-text">QUE ABORDA LA PROPUESTA</span>',cards([['📨','Ingreso documental','TAD, expedientes, notas y presentaciones.'],['✅','Control de requisitos','Validación, faltantes y subsanaciones.'],['🧾','Constitución','Cooperativas, mutuales, estatutos y matrículas.'],['🔄','Actualización registral','Autoridades, domicilio, reglamentos y reformas.'],['📚','Presentaciones periódicas','Balances, memorias, actas e informes.'],['🗳️','Asambleas','Convocatorias, plazos, veedurías y resultados.'],['🔎','Fiscalización','Denuncias, inspecciones, observaciones y cierre.'],['🔔','Notificaciones','Intimaciones, respuestas, vencimientos y seguimiento.']], 'md:grid-cols-4')),
shell('07 · OBJETIVO GENERAL','CAPACITAR PARA TRABAJAR CON<br><span class="gradient-text">MÁS CRITERIO, VELOCIDAD Y TRAZABILIDAD</span>',`<div class="glass rounded-3xl p-7 mb-5"><p class="text-lg md:text-xl text-slate-200">Fortalecer las capacidades del personal administrativo de INAES Entre Ríos para analizar, documentar, estandarizar y mejorar procesos mediante herramientas digitales, Inteligencia Artificial, automatización e Inteligencia Operativa.</p></div><div class="grid md:grid-cols-2 gap-3">${['Identificar demoras, duplicaciones, riesgos y tareas repetitivas.','Estandarizar procedimientos, checklists y criterios de control.','Utilizar IA para documentación, análisis y comunicación.','Diseñar automatizaciones simples y seguras.','Construir tableros e indicadores para la gestión.','Aplicar criterios de confidencialidad y validación humana.','Crear una base de conocimiento institucional.','Desarrollar una propuesta de mejora sobre un proceso real.'].map(x=>`<div class="pill rounded-xl p-4">✔ ${x}</div>`).join('')}</div>`),
shell('08 · METODOLOGÍA','APRENDER SOBRE PROCESOS REALES,<br><span class="gradient-text">NO SOBRE EJEMPLOS ABSTRACTOS</span>',cards([['📘','Conceptos claros','Fundamentos explicados sin tecnicismos innecesarios.'],['🖥️','Demostraciones','Herramientas aplicadas en vivo sobre casos administrativos.'],['🛠️','Talleres','Producción de recursos reutilizables en el trabajo diario.'],['👥','Trabajo colaborativo','Intercambio entre áreas y construcción de criterios comunes.'],['🧪','Prototipos','Automatizaciones y tableros de alcance controlado.'],['🚀','Proyecto final','Rediseño integral de un proceso seleccionado.']], 'md:grid-cols-3')),
shell('09 · ORGANIZACIÓN ACADÉMICA','UNA PROPUESTA FLEXIBLE PARA<br><span class="gradient-text">UNA EXPERIENCIA PILOTO PROVINCIAL</span>',`<div class="grid md:grid-cols-2 gap-5"><div class="glass rounded-3xl p-7 text-center"><div class="text-6xl">🏛️</div><h3 class="text-cyan-300 text-2xl font-black mt-4">PRESENCIAL</h3><p class="text-slate-300 mt-3">Encuentros en sede acordada, con laboratorio práctico y acompañamiento directo.</p></div><div class="glass rounded-3xl p-7 text-center"><div class="text-6xl">💻</div><h3 class="text-blue-300 text-2xl font-black mt-4">VIRTUAL EN VIVO</h3><p class="text-slate-300 mt-3">Participación sincrónica para facilitar alcance territorial y continuidad operativa.</p></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">${[['10','encuentros'],['2 h','por encuentro'],['20 h','carga total'],['Híbrida','modalidad sugerida']].map(x=>`<div class="pill rounded-xl p-4 text-center"><b class="text-xl">${x[0]}</b><br><span class="text-slate-400 text-sm">${x[1]}</span></div>`).join('')}</div>`),
shell('10 · DESARROLLO CURRICULAR','MÓDULOS 1 Y 2 · <span class="gradient-text">ESTADO, PROCESOS Y ECONOMÍA SOCIAL</span>',modulePair('01','Administración pública y transformación digital',['La función estratégica del personal administrativo.','Modernización, servicio público y mejora continua.','Digitalización, IA, automatización e IO.','Tecnología centrada en las personas.','Detección de tareas críticas y repetitivas.'],'mapa inicial del trabajo administrativo.','02','Procesos administrativos del INAES',['Ciclo de vida del expediente.','Constitución y gestión registral.','Balances, asambleas y documentación periódica.','Fiscalización, intimaciones y seguimiento.','Relación con cooperativas, mutuales y profesionales.'],'selección y descripción de un circuito real.')),
shell('11 · DESARROLLO CURRICULAR','MÓDULOS 3 Y 4 · <span class="gradient-text">MAPEO Y DOCUMENTACIÓN</span>',modulePair('03','Mapeo y estandarización de procesos',['Entradas, actividades, decisiones y resultados.','Roles, responsables y puntos de control.','Demoras, duplicaciones y retrabajos.','Procedimientos, protocolos y checklists.','Criterios para rediseñar sin perder control.'],'rediseño de un circuito administrativo.','04','Gestión documental inteligente',['Clasificación, nomenclatura y versionado.','Lectura, resumen y comparación asistidos por IA.','Bases de conocimiento y búsqueda institucional.','Alertas de vencimiento y actualización.','Trazabilidad y acceso según roles.'],'prototipo de asistente documental interno.')),
shell('12 · DESARROLLO CURRICULAR','MÓDULOS 5 Y 6 · <span class="gradient-text">IA Y COMUNICACIÓN</span>',modulePair('05','Inteligencia Artificial aplicada',['Prompts para tareas administrativas.','Resumen de normativa y expedientes.','Extracción y clasificación de información.','Preparación de borradores e informes.','Validación humana y límites de uso.'],'biblioteca de prompts institucionales.','06','Comunicación y atención asistida',['Correos, notas, respuestas e intimaciones.','Lenguaje claro y comunicación formal.','Guías de orientación para trámites.','Respuestas consistentes en canales institucionales.','Escalamiento de casos complejos.'],'biblioteca de comunicaciones modelo.')),
shell('13 · DESARROLLO CURRICULAR','MÓDULOS 7 Y 8 · <span class="gradient-text">AUTOMATIZACIÓN E INDICADORES</span>',modulePair('07','Automatización administrativa accesible',['Formularios, planillas, carpetas y calendarios conectados.','Alertas, recordatorios y derivaciones.','Seguimiento de solicitudes y estados.','Generación automática de documentos y reportes.','Introducción a flujos sin código.'],'automatización de un circuito simple.','08','Indicadores y tableros de gestión',['Volumen de ingresos y egresos.','Tiempos de resolución y pendientes.','Faltantes, subsanaciones y recurrencias.','Distribución por tipo de trámite y área.','KPIs para supervisión y mejora continua.'],'tablero operativo de seguimiento.')),
shell('14 · DESARROLLO CURRICULAR','MÓDULOS 9 Y 10 · <span class="gradient-text">GOBERNANZA Y PROYECTO APLICADO</span>',modulePair('09','Seguridad, ética y gobernanza',['Protección de datos y confidencialidad.','Información apta y no apta para herramientas externas.','Permisos, accesos y trazabilidad.','Supervisión humana y responsabilidad.','Documentación de herramientas y decisiones.'],'protocolo de uso responsable.','10','Proyecto integrador de IO',['Selección de un proceso real.','Diagnóstico del funcionamiento actual.','Diseño del proceso mejorado.','Incorporación de IA, automatización e indicadores.','Presentación y devolución técnica.'],'propuesta lista para evaluación institucional.')),
shell('15 · HERRAMIENTAS','TECNOLOGÍAS SELECCIONADAS POR<br><span class="gradient-text">UTILIDAD, ACCESIBILIDAD Y CONTROL</span>',cards([['🤖','IA generativa','ChatGPT, Gemini, Claude o equivalentes autorizados.'],['☁️','Productividad','Drive, Docs, Sheets, Forms, Calendar o herramientas institucionales.'],['📚','Conocimiento','NotebookLM y asistentes documentales controlados.'],['⚙️','Automatización','Flujos sin código y soluciones integrables.'],['📊','Visualización','Tableros operativos e indicadores.'],['🔐','Gobernanza','Permisos, protocolos y trazabilidad de uso.']], 'md:grid-cols-3')+`<div class="glass rounded-2xl p-5 mt-5"><b class="text-cyan-300">Criterio pedagógico:</b> ninguna herramienta se enseña como catálogo; se incorpora únicamente cuando resuelve una necesidad concreta del proceso.</div>`),

document.getElementById('presentation').innerHTML=slides.join('');
let current=0;const els=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots'),counter=document.getElementById('counter');
function track(n,p={}){if(typeof gtag==='function')gtag('event',n,p)}
function init(){els.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>show(i);b.setAttribute('aria-label','Ir a diapositiva '+(i+1));dots.appendChild(b)});show(0);lucide?.createIcons()}
function show(i){current=(i+els.length)%els.length;els.forEach((s,j)=>{s.classList.toggle('active',j===current);if(j===current)s.scrollTop=0});[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===current));counter.textContent=`${current+1} / ${els.length}`;track('slide_view',{presentation:'inaes_entre_rios_iec',slide_number:current+1})}
function changeSlide(d){show(current+d)}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();track('presentation_fullscreen',{presentation:'inaes_entre_rios_iec'})}else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();changeSlide(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();changeSlide(-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1);if(e.key.toLowerCase()==='f')toggleFullscreen()});
let tx=null;document.addEventListener('touchstart',e=>tx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].screenX-tx;if(Math.abs(d)>60)changeSlide(d<0?1:-1);tx=null},{passive:true});
window.addEventListener('load',init);
</script>

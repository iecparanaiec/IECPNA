<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FEMER Mesa de Entrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra institucional + navegación lateral por vista + área de trabajo con panel de detalle */
:root{
  --brand:#16806f; --brand-ink:#0d5b4f; --brand-soft:#e3f2ef;
  --bg:#f3f7f6; --surface:#ffffff; --surface-2:#f8fbfa; --line:#d9e4e1;
  --fg:#13231f; --muted:#5a6d68; --faint:#8a9b97;
  --crit:#c23434; --crit-soft:#fbe6e6; --alta:#c46a0a; --alta-soft:#fcefdc;
  --media:#2f6fae; --media-soft:#e3eef9; --baja:#677874; --baja-soft:#edf1f0;
  --wa:#1f9d5c; --wa-soft:#ddf3e7; --mail:#45607a; --mail-soft:#e5ecf3;
  --ok:#1f8a5b; --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 20px rgba(15,40,35,.06);
  --f-display:"Schibsted Grotesk",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3db39b; --brand-ink:#8fdcca; --brand-soft:#16312c;
  --bg:#0c1513; --surface:#13201d; --surface-2:#172724; --line:#25372f;
  --fg:#e2ece9; --muted:#97aaa5; --faint:#6c807b;
  --crit:#ef7070; --crit-soft:#3a1a1a; --alta:#efa54a; --alta-soft:#38270f;
  --media:#7fb2e6; --media-soft:#16283a; --baja:#9fb0ac; --baja-soft:#1f2b29;
  --wa:#4cc887; --wa-soft:#14301f; --mail:#9bb4cc; --mail-soft:#1a2633;
  --ok:#55c98f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#3db39b; --brand-ink:#8fdcca; --brand-soft:#16312c;
  --bg:#0c1513; --surface:#13201d; --surface-2:#172724; --line:#25372f;
  --fg:#e2ece9; --muted:#97aaa5; --faint:#6c807b;
  --crit:#ef7070; --crit-soft:#3a1a1a; --alta:#efa54a; --alta-soft:#38270f;
  --media:#7fb2e6; --media-soft:#16283a; --baja:#9fb0ac; --baja-soft:#1f2b29;
  --wa:#4cc887; --wa-soft:#14301f; --mail:#9bb4cc; --mail-soft:#1a2633;
  --ok:#55c98f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:16px;letter-spacing:.01em;line-height:1.15}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.role select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--fg);max-width:220px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06231d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06231d}}
.btn.primary:hover{filter:brightness(1.07)}
.bell{position:relative;width:36px;height:36px;justify-content:center;padding:0}
.bell i{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}

/* Estructura */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 63px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:10px 10px 4px;font-weight:600}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;color:var(--muted);font-weight:500}
.side button:hover{background:var(--surface-2);color:var(--fg)}
.side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.side button .n{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--muted)}
.side svg{width:17px;height:17px;flex:none}
.side .foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.45}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:23px;font-weight:700}
.view-head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.view-head .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Métricas */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
.kpi.alert b{color:var(--crit)}

/* Bandeja */
.inbox{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.filters input{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:13px;min-width:0;width:180px}
.list{max-height:calc(100vh - 290px);min-height:360px;overflow:auto}
.row{display:grid;grid-template-columns:6px 30px minmax(0,1fr) auto;gap:10px;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start;background:var(--surface)}
.row:hover{background:var(--surface-2)}
.row[aria-selected="true"]{background:var(--brand-soft)}
.row .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.row.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:var(--brand-soft)}100%{background:var(--surface)}}
.ch{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ch svg{width:16px;height:16px}
.ch.wa{background:var(--wa-soft);color:var(--wa)} .ch.email{background:var(--mail-soft);color:var(--mail)}
.row .who{display:flex;gap:6px;align-items:baseline;min-width:0}
.row .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .subj{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.row .meta{text-align:right;font-size:12px;color:var(--faint);display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}
.tag{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.area{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);font-weight:600}
.tag.ia{border-style:dashed}
.prio{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
.p-critica{background:var(--crit-soft);color:var(--crit)} .p-alta{background:var(--alta-soft);color:var(--alta)}
.p-media{background:var(--media-soft);color:var(--media)} .p-baja{background:var(--baja-soft);color:var(--baja)}
.s-critica{background:var(--crit)} .s-alta{background:var(--alta)} .s-media{background:var(--media)} .s-baja{background:var(--line)}

/* Detalle */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.d-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.d-head .exp{font-size:12px;color:var(--faint)}
.d-head h2{font-size:18px;margin-top:3px;line-height:1.3}
.d-head .from{color:var(--muted);font-size:13px;margin-top:4px}
.d-body{padding:14px 16px;display:grid;gap:14px;max-height:calc(100vh - 230px);overflow:auto}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:7px;font-weight:600;font-family:var(--f-body)}
.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:13.5px;white-space:pre-line}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface);font-family:var(--f-mono)}
.chat{display:flex;flex-direction:column;gap:6px}
.bub{max-width:86%;padding:7px 10px;border-radius:10px;font-size:13.5px;white-space:pre-line}
.bub.in{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:3px}
.bub.out{background:var(--wa-soft);align-self:flex-end;border-top-right-radius:3px}
.bub small{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.ai-box{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ai-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:var(--brand-soft);color:var(--brand-ink);font-size:13px;font-weight:600}
.ai-top .conf{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);font-size:13px}
.kv div{padding:6px 12px;border-top:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){font-weight:500}
.next{padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.next b{color:var(--brand-ink)}
.score{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.score b{color:var(--fg);font-variant-numeric:tabular-nums}
.route{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.route select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0;max-width:100%}
.reply{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);resize:vertical;font-size:13.5px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;font-size:13px;padding-bottom:9px;position:relative}
.tl li::before{content:"";position:absolute;left:7px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:10px;height:10px;border-radius:50%;margin:4px 0 0 3px;background:var(--brand);position:relative;z-index:1}
.tl .dot.h{background:var(--surface);border:2px solid var(--brand)}
.tl .t{color:var(--faint);font-size:12px;white-space:nowrap}
.tl .who{color:var(--muted);font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* Pipeline */
.areas{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.areas button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;display:flex;gap:7px;align-items:center;color:var(--muted)}
.areas button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft);font-weight:700}
.areas .c{font-family:var(--f-mono);font-size:11px}
.areas .c.hot{color:var(--crit);font-weight:700}
.puesto{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.puesto .av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.puesto b{display:block;font-family:var(--f-display);font-size:15px}
.puesto span{color:var(--muted);font-size:12.5px}
.puesto .stats{margin-left:auto;display:flex;gap:18px;font-size:12px;color:var(--muted)}
.puesto .stats b{font-size:18px;font-variant-numeric:tabular-nums}
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;min-width:1150px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:300px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:9px;padding:0 2px}
.col-h span{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);font-weight:400}
.col-h small{margin-left:auto;font-weight:400;color:var(--faint);font-size:11px}
.cards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;display:grid;gap:6px;position:relative;overflow:hidden}
.card:hover{border-color:var(--brand)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .l1{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint);padding-left:4px}
.card .l1 .ch{width:20px;height:20px;border-radius:5px}
.card .l1 .ch svg{width:12px;height:12px}
.card .l1 .prio{margin-left:auto}
.card .ttl{font-weight:600;font-size:13px;line-height:1.35;padding-left:4px}
.card .l3{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);padding-left:4px;flex-wrap:wrap}
.card .due.late{color:var(--crit);font-weight:700}
.card .mv{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11.5px;padding:1px 7px}
.card .mv:hover{border-color:var(--brand);color:var(--brand-ink)}

/* Organigrama */
.org{display:grid;gap:14px}
.org-top{display:flex;flex-direction:column;align-items:center;gap:0}
.node{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.node b{display:block;font-family:var(--f-display);font-size:14px}
.node span{font-size:12px;color:var(--muted)}
.node.gov{background:var(--brand);border-color:var(--brand);color:#fff}
.node.gov span{color:rgba(255,255,255,.82)}
:root[data-theme="dark"] .node.gov{color:#06231d} :root[data-theme="dark"] .node.gov span{color:#0b3a31}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .node.gov{color:#06231d} :root:not([data-theme="light"]) .node.gov span{color:#0b3a31}}
.vline{width:2px;height:16px;background:var(--line)}
.row3{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.org-areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.oa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:grid;gap:7px;align-content:start}
.oa h3{font-size:15px}
.oa .p{font-size:12.5px;color:var(--muted)}
.oa ul{margin:0;padding-left:17px;font-size:12.5px;color:var(--fg)}
.oa .f{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.note{background:var(--alta-soft);color:var(--fg);border-radius:10px;padding:10px 13px;font-size:13px;max-width:90ch}

/* Automatizaciones */
.flow{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;margin-bottom:18px}
.step{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);padding:11px 12px;display:grid;gap:3px;align-content:start;position:relative}
.step:first-child{border-radius:10px 0 0 10px} .step:last-child{border-radius:0 10px 10px 0}
.step + .step{border-left:0}
.step .k{font-family:var(--f-mono);font-size:11px;color:var(--brand)}
.step b{font-family:var(--f-display);font-size:14px}
.step span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.src{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin:0 4px 3px 0;background:var(--brand-soft);color:var(--brand-ink)}

/* Simulación y avisos */
.proc{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:13px 14px}
.proc h3{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.proc ol{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.proc li{display:flex;gap:8px;align-items:center;color:var(--faint)}
.proc li.on{color:var(--fg)} .proc li.done{color:var(--muted)}
.proc li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.proc li.on i{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.proc li.done i{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.toasts{position:fixed;z-index:41;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--surface);border-radius:10px;padding:9px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease-out}
.toast svg{width:16px;height:16px;flex:none;margin-top:2px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.notif{position:absolute;right:0;top:44px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:420px;overflow:auto}
.notif div{padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.notif div small{display:block;color:var(--faint);font-size:11.5px}
.rel{position:relative}
/* Animación de ingreso: latido del logo + trazo de electrocardiograma */
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));transition:opacity .6s ease,visibility .6s}
.intro.out{opacity:0;visibility:hidden}
.intro-in{display:grid;justify-items:center;gap:14px;width:min(560px,100%)}
.intro-logo{position:relative;width:132px;height:132px;display:grid;place-items:center}
.intro-logo img{width:120px;height:120px;border-radius:50%;background:#fff;position:relative;z-index:1;opacity:0;animation:logoIn .7s .1s ease-out forwards,beat 1.1s 1s ease-in-out 2}
.intro-logo span{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ring 1.1s 1s ease-out 2}
.ecg{width:100%;height:70px;overflow:visible}
.ecg path{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.8s .5s cubic-bezier(.45,.05,.4,1) forwards}
.ecg .base{stroke:var(--line);stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.intro h1{font-size:26px;letter-spacing:.01em;opacity:0;animation:up .6s 1.3s ease-out forwards}
.intro p{margin:0;color:var(--muted);font-size:13px;min-height:20px;opacity:0;animation:up .6s 1.5s ease-out forwards;font-family:var(--f-mono)}
.intro .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border:0;background:none;color:var(--faint);font-size:12px}
@keyframes logoIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}45%{transform:scale(1.05)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.intro-logo img,.intro h1,.intro p{opacity:1}.ecg path{stroke-dashoffset:0}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.inbox{grid-template-columns:minmax(0,1fr)}.detail{position:static}.list{max-height:none;min-height:0}.d-body{max-height:none}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .side .lbl,.side .foot{display:none}
  .side button{flex:none;white-space:nowrap}
  .role span{display:none}
  .brand span{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .puesto .stats{margin-left:0}
}
@media (max-width:480px){.top-actions .btn.primary span{display:none}.role select{max-width:150px}.filters input{width:100%;margin-left:0}}
</style>
</head>

  t.push([m,`Aviso por ${AREA[it.area].aviso.startsWith('WhatsApp')?'WhatsApp':'bandeja'} a ${AREA[it.area].puesto}`,'Sistema']);
  if(it.canal==='wa') t.push([m,'Acuse con número de seguimiento enviado al remitente','IA']);
  else if(it.canal==='email' && it.area!=='tesoreria') t.push([m,'Acuse de recibo enviado en el mismo hilo','IA']);
  const order=STAGES.map(s=>s.id), idx=order.indexOf(it.estado);
  if(idx>=1) t.push([Math.max(m-8,0),'Tomado por el puesto',AREA[it.area].puesto]);
  if(idx>=2) t.push([Math.max(m-25,0),'Respuesta en redacción',AREA[it.area].puesto]);
  if(idx>=3) t.push([Math.max(m-40,0),'En implementación',AREA[it.area].puesto]);
  if(idx>=4) t.push([Math.max(m-60,0),'Cerrado y notificado al remitente',AREA[it.area].puesto]);
  (it.extra||[]).forEach(e=>t.push(e));
  return t;
}

function toast(txt){const t=document.createElement('div');t.className='toast';t.innerHTML=ICON.wa+'<div>'+esc(txt)+'</div>';document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function notify(it){const a=AREA[it.area];const txt=`Aviso a ${a.puesto} (${a.n}): ME-2026-${it.id} · ${it.asunto}`;notifs.unshift({txt,t:'ahora',read:false});toast(txt);
  (it.cc||[]).forEach(c=>notifs.unshift({txt:`Copia a ${AREA[c].puesto}: ME-2026-${it.id}`,t:'ahora',read:false}))}

function advance(id){const it=ITEMS.find(i=>i.id===id);const k=STAGES.findIndex(s=>s.id===it.estado);if(k<4){it.estado=STAGES[k+1].id;toast(`ME-2026-${id} pasó a ${STAGES[k+1].n}`)}render()}

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;render();return}
  const f=e.target.closest('[data-f]');if(f){state.filter=f.dataset.f;render();return}
  const ar=e.target.closest('[data-area]');if(ar){state.area=ar.dataset.area;render();return}
  const adv=e.target.closest('[data-adv]');if(adv){e.stopPropagation();advance(adv.dataset.adv);return}
  const r=e.target.closest('.row');if(r){state.sel=r.dataset.id;render();return}
  const o=e.target.closest('[data-open]');if(o){state.sel=o.dataset.open;state.view='bandeja';state.filter='todos';state.q='';render();window.scrollTo({top:0});return}
  if(e.target.closest('#advBtn')){advance(state.sel);return}
  if(e.target.closest('#rerouteBtn')){const it=ITEMS.find(i=>i.id===state.sel);const to=document.getElementById('reroute').value;if(to!==it.area){const from=AREA[it.area].n;it.area=to;(it.extra=it.extra||[]).push([0,`Re-derivado manualmente de ${from} a ${AREA[to].n}. La corrección se usa para mejorar la clasificación.`,'Mesa de Entrada']);notify(it)}render();return}
  if(e.target.closest('#sendBtn')){const it=ITEMS.find(i=>i.id===state.sel);const txt=document.getElementById('replyTxt').value.trim();if(!txt)return;
    if(it.canal==='wa')it.hilo.push(['out',txt,AREA[it.area].puesto]);(it.extra=it.extra||[]).push([0,`Respuesta enviada al remitente${it.canal==='wa'?' · IA pausada 12 h':''}`,AREA[it.area].puesto]);
    if(it.estado==='nuevo'||it.estado==='analisis')it.estado='respuesta';it.resp='';toast(it.canal==='wa'?'Mensaje enviado por WhatsApp (simulado)':'Respuesta enviada en el hilo (simulado)');render();return}
  if(e.target.closest('#bellBtn')){const p=document.getElementById('notif');p.hidden=!p.hidden;
    p.innerHTML=notifs.length?notifs.map(n=>`<div>${esc(n.txt)}<small>${n.t} · por WhatsApp</small></div>`).join(''):'<div>Sin avisos nuevos. Probá «Simular ingreso».</div>';notifs.forEach(n=>n.read=true);document.getElementById('bellN').hidden=true;return}
  if(e.target.closest('#simBtn')){simulate();return}
  if(!e.target.closest('#notif'))document.getElementById('notif').hidden=true;
});

let simBusy=false;
function simulate(){
  if(simBusy)return; const next=QUEUE.shift();
  if(!next){toast('No quedan ejemplos para simular. Recargá la página para reiniciar.');return}
  simBusy=true; const a=AREA[next.area];
  const steps=[`Recibido por ${next.canal==='wa'?'WhatsApp':'correo'} · ${next.org}`, next.adj&&next.adj.length?`Leyendo ${next.adj.length} adjunto${next.adj.length>1?'s':''} con IA`:'Leyendo el mensaje con IA',`Clasificado: ${next.tipo}`,`Extraídos ${Object.keys(next.ex).length} datos clave`,`Derivado a ${a.n}`,`Aviso por WhatsApp a ${a.puesto}`];
  const box=document.getElementById('proc');box.hidden=false;
  box.innerHTML=`<h3>${ICON[next.canal].replace('<svg','<svg width="16" height="16"')}Procesando ME-2026-${next.id}</h3><ol>${steps.map(s=>`<li><i></i>${esc(s)}</li>`).join('')}</ol>`;
  const lis=[...box.querySelectorAll('li')];let k=0;
  const tick=()=>{lis.forEach((l,j)=>l.className=j<k?'done':j===k?'on':'');
    if(k===lis.length){setTimeout(()=>{box.hidden=true;simBusy=false},900);
      ITEMS.forEach(i=>i.min+=3);next.min=0;next.fresh=true;ITEMS.unshift(next);state.sel=next.id;
      if(state.view!=='bandeja'&&state.view!=='pipeline')state.view='bandeja';if(state.view==='pipeline')state.area=next.area;
      notify(next);render();return}
    k++;setTimeout(tick,matchMedia('(prefers-reduced-motion: reduce)').matches?150:650)};
  tick();
}
render();

(function intro(){
  const el=document.getElementById('intro');
  document.getElementById('introLogo').src=document.querySelector('.brand img').src;
  const msgs=['Conectando casillas de correo…','Conectando WhatsApp institucional…','Asistente IA listo · 15 comunicaciones en bandeja'];
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timers=msgs.slice(1).map((m,i)=>setTimeout(()=>{document.getElementById('introMsg').textContent=m},reduced?0:1500+i*800));
  const close=()=>{timers.forEach(clearTimeout);el.classList.add('out');setTimeout(()=>el.remove(),650)};
  const auto=setTimeout(close,reduced?600:3600);
  document.getElementById('introSkip').addEventListener('click',()=>{clearTimeout(auto);close()});
})();
</script>
